<style>
@import url('https://fonts.googleapis.com/css2?family=Lateef:wght@200;300;400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap');
    
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Estedad', sans-serif;
}

body{
    direction:rtl;
    background: radial-gradient(circle at top, #000000, #000000);
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.main{
    width:95%;
    max-width:1100px;
    display:grid;
    grid-template-columns:1fr 2fr;
    gap:25px;
}

/* معرفی کانال */
.right{
    background:linear-gradient(160deg,#000000,#000000);
    border-radius:22px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 25px rgba(255, 216, 77, 0.25);
}

.channel-logo {
    width: 110px;
    height: 110px;
    margin: 0 auto 15px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #FFD700;
    background: #000000;
    /* این خطوط کمک می‌کنند تا عکس بهتر مدیریت شود */
    display: flex;
    justify-content: center;
    align-items: center;
}

/* این بخش جدید است و برای جابه‌جا کردن عکس به سمت بالا اضافه شد */
.channel-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;     /* باعث می‌شود عکس دایره را پر کند بدون اینکه دفرمه شود */
    object-position: top;  /* بخش بالایی عکس را در مرکز دایره نشان می‌دهد */
}


.channel-name{
    font-size:24px;
    font-weight:700;
    color:#ffd84d;
    margin-bottom:8px;
}

.channel-desc{
    font-size:14px;
    color:#ddd;
    margin-bottom:15px;
}

.channel-ads{
    font-size:13px;
    color:#aaa;
    line-height:1.8;
}

/* بلاک‌ها */
.left{
    text-align:right;
}

.title{
    font-size:34px;
    font-weight:700;
    margin-bottom:8px;
    color:#ffd84d;
}

.subtitle{
    font-size:14px;
    color:#ccc;
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.grid a{
    background:linear-gradient(145deg,#000000,#000000);
    border-radius:18px;
    padding:18px 10px;
    text-decoration:none;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    transition:0.35s;
    box-shadow:0 0 18px rgba(255,216,77,0.25);
    cursor:pointer;
}

.grid a:hover{
    transform:translateY(-6px);
    box-shadow:0 0 28px rgba(255,216,77,0.6);
}

.icon-box{
    width:56px;
    height:56px;
    border-radius:16px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
}

.icon-box img{
    width:70%;
    height:70%;
    object-fit:contain;
}

.grid span{
    font-size:14px;
    font-weight:700;
}

.footer{
    margin-top:20px;
    font-size:12px;
    color:#888;
    text-align:center;
}
/* نسخه موبایل */
@media (max-width: 768px) {
    .main {
        grid-template-columns: 1fr;
        gap: 30px;
    }

    .channel-logo {
        width: 140px;
        height: 140px;
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 22px;
    }

    .icon-box {
        width: 85px;
        height: 85px;
    }

    .title {
        font-size: 28px;
    }

    .subtitle {
        font-size: 14px;
    }

    body {
        padding-bottom: 100px;
    }
}
</style>
</head>
